name: mobile_phone_vision
description: Hybrid Split-Inference Object Detection App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5+9
  tflite_flutter: ^0.10.4
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8
  firebase_storage: ^11.6.9
  google_sign_in: ^6.2.1
  http: ^1.2.0
  connectivity_plus: ^5.0.2
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  image: ^4.1.7
  fluttertoast: ^8.2.4
  flutter_spinkit: ^5.2.0
  cupertino_icons: ^1.0.2
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/labels/
